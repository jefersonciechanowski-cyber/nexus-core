<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071116">
  <title>Nexus CRM | Página comercial oficial</title>
  <meta name="description" content="O site de captação aprovado do Nexus CRM é acessado pelo domínio oficial do aplicativo.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://crm.nexuscore.app.br/site-captacao">
  <meta http-equiv="refresh" content="2;url=https://crm.nexuscore.app.br/site-captacao">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071116;color:#e9e9e3;font:16px/1.6 Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(560px,calc(100% - 40px));padding:42px;text-align:center;border:1px solid #3a4747;border-radius:18px;background:#102026}
    img{width:min(230px,100%);height:auto;display:block;margin:0 auto 20px}
    p{color:#b9c5c6;font-size:14px}
    a{display:inline-block;margin-top:12px;color:#1d1608;background:#e3b94c;border-radius:9px;font-weight:750;padding:10px 18px;text-decoration:none}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  </style>
  <script defer src="/crm/redirect.js"></script>
</head>
<body>
  <main>
    <img src="/apps/sst-controle/logo-nexus-core.png" alt="Nexus Core" width="230" height="70">
    <h1>Nexus CRM</h1>
    <p>Abrindo o site comercial oficial que apresenta o sistema, demonstração, planos e opções de contratação.</p>
    <a href="https://crm.nexuscore.app.br/site-captacao">Acessar site oficial do Nexus CRM</a>
  </main>
</body>
</html>
