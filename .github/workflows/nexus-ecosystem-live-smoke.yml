name: Nexus ecosystem and approved CRM landing smoke

on:
  push:
    branches: [main]
    paths:
      - index.html
      - site.css
      - crm/**
      - apps/site-captacao/index.html
      - sst-controle/**
      - .github/workflows/nexus-ecosystem-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_official_domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Nexus corporate homepage and approved Vercel CRM capture, without leads or payments
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nexuscore.app.br'
          APPROVED='https://crm.nexuscore.app.br/site-captacao'
          READY=0
          for ATTEMPT in $(seq 1 12); do
            echo "Checking Nexus marketing routes — attempt ${ATTEMPT}/12"
            HOME="$(curl --silent --show-error --location --max-time 14 --output /tmp/nexus-home.html --write-out '%{http_code}' "${ORIGIN}/" || true)"
            CRM="$(curl --silent --show-error --location --max-time 14 --output /tmp/nexus-crm.html --write-out '%{http_code}' "${ORIGIN}/crm/?utm_source=instagram&utm_medium=paid_social&utm_campaign=nexus_crm_lancamento" || true)"
            SCRIPT="$(curl --silent --show-error --location --max-time 14 --output /tmp/nexus-crm-redirect.js --write-out '%{http_code}' "${ORIGIN}/crm/redirect.js" || true)"
            ORIGINAL="$(curl --silent --show-error --location --max-time 14 --output /tmp/nexus-original-crm.html --write-out '%{http_code}' "${APPROVED}?utm_source=instagram&utm_campaign=nexus_crm_lancamento" || true)"
            SST="$(curl --silent --show-error --location --max-time 14 --output /tmp/nexus-sst.html --write-out '%{http_code}' "${ORIGIN}/sst-controle/" || true)"
            echo "HTTP: home=${HOME} crmAlias=${CRM} redirectJs=${SCRIPT} originalCrm=${ORIGINAL} sst=${SST}"
            if [[ "${HOME}" == "200" && "${CRM}" == "200" && "${SCRIPT}" == "200" && "${ORIGINAL}" == "200" && "${SST}" == "200" ]] &&
               grep -q 'Nexus Core Industrial Trust' /tmp/nexus-home.html &&
               grep -q 'href="https://crm.nexuscore.app.br/site-captacao"' /tmp/nexus-home.html &&
               grep -q 'src="/crm/redirect.js"' /tmp/nexus-crm.html &&
               grep -q 'new URL(.*crm.nexuscore.app.br/site-captacao' /tmp/nexus-crm-redirect.js &&
               grep -q 'window.location.search' /tmp/nexus-crm-redirect.js &&
               grep -q 'Nexus CRM' /tmp/nexus-original-crm.html &&
               grep -q 'url=/apps/site-captacao/' /tmp/nexus-sst.html; then
              READY=1
              break
            fi
            sleep 12
          done
          if [[ "${READY}" != "1" ]]; then
            echo "::error::Nexus CRM approved original capture not yet reachable from official marketing routes."
            exit 1
          fi
          echo 'PASS: Nexus home links to original CRM, /crm forwards attribution, original CRM and SST are online. Zero lead/payment writes.'
