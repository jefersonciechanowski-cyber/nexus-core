name: Git credential history audit
on:
  pull_request:
  push:
    branches: [main, deploy/meta-account-scope-production]
    paths:
      - ".github/workflows/credential-history.yml"
      - "scripts/scan-git-credential-history.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify auditor syntax
        run: node --check scripts/scan-git-credential-history.mjs
      - name: Inspect Git history without printing secret values
        run: node scripts/scan-git-credential-history.mjs
