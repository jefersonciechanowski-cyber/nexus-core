name: CRM trial expiration — controlled pilot

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  expire_trials:
    # The workflow is skipped by default. Release requires explicit
    # repository variable, independent Supabase flags and private OIDC auth.
    if: vars.NEXUS_CRM_TRIAL_EXPIRY_WORKFLOW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-crm-trial-reconcile")"
          TOKEN="$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          printf 'token=%s\n' "${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile expired CRM trials without charging customers
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT
          HTTP="$(curl --silent --show-error --max-time 45 \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-trial-reconcile" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --output "${BODY_FILE}" --write-out '%{http_code}' \
            --data '{}')"
          python3 - "${HTTP}" "${BODY_FILE}" <<'PY'
          import json
          import sys
          http, path = sys.argv[1:]
          try:
              with open(path, encoding='utf8') as f:
                  data = json.load(f)
          except (OSError, ValueError):
              print('Trial expiry: invalid backend response')
              sys.exit(1)
          if http == '503' and data.get('error') == 'Conciliação de testes em homologação.':
              print('Trial expiry: backend release gate is closed; no changes')
              sys.exit(0)
          if http == '200' and type(data.get('pending_review')) is int and data['pending_review'] == 0 and type(data.get('suspended')) is int and type(data.get('synced')) is int and data['suspended'] == data['synced']:
              print('Trial expiry: completed and CRM entitlement reconciled')
              sys.exit(0)
          print('Trial expiry: backend or entitlement delivery requires review (HTTP ' + http + ')')
          sys.exit(1)
          PY
