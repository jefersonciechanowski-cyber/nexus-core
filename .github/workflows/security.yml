name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run security checks
        run: npm run security:check

      - name: Verify Nexus Admin session continuity and MFA across tabs
        run: node --test tests/nexus-admin-login-session.test.mjs

      - name: Validate Nexus CRM Stripe monthly checkout without payments
        run: node --test tests/crm-monthly-checkout.test.mjs tests/crm-monthly-checkout-bridge.test.mjs tests/crm-stripe-first-checkout.test.mjs

      - name: Test HMAC diagnostic without payments
        run: node --test tests/crm-bridge-diagnostic.test.mjs

      - name: Set up Deno for isolated real Pix admin pilot typecheck
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck hard-off live Pix pilot without credentials or charges
        run: |
          deno check --node-modules-dir=auto supabase/functions/nexus-admin-crm-live-pix-pilot/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-admin-asaas-production-health/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-admin-crm-email-health/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-events/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-monthly-asaas-production/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-verify/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-provision/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-lifecycle-preview/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-renewal/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-admin-crm-email-send-test/index.ts
          deno check --node-modules-dir=auto supabase/functions/stripe-webhook/crm-provisioning.ts

      - name: Verify Brevo first-access sender configuration read-only (no emails)
        run: node --test tests/crm-onboarding-email-readiness.test.mjs tests/crm-brevo-smtp-transport.test.mjs tests/crm-admin-smtp-selftest.test.mjs

      - name: Verify normal paid CRM first-access email (no emails actually sent)
        run: node --test tests/crm-crm-first-access-mail.test.mjs

      - name: Verify Asaas prepaid expiry guard and monthly contract isolation (no charges)
        run: node --test tests/crm-asaas-prepaid-expiry.test.mjs

      - name: Verify OIDC production Asaas queue routing stays financial hard-off
        run: |
          node --test tests/crm-asaas-production-dispatcher.test.mjs
          deno check --node-modules-dir=auto supabase/functions/nexus-crm-asaas-production-dispatch/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-trial-request/index.ts
          deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-trial-activate/index.ts

      - name: Verify webhook health probe is read-only and cannot create Asaas payments
        run: node --test tests/crm-asaas-internal-webhook-probe.test.mjs

      - name: Verify Asaas CRM marketing origin and live checkout remain protected
        run: node --test tests/crm-asaas-production-marketing-origin.test.mjs

      - name: Verify read-only Asaas production credentials diagnostic (no charges)
        run: node --test tests/crm-asaas-production-health.test.mjs

      - name: Validate CRM ad lead capture with no payments or identity provisioning
        run: |
          node --test tests/crm-public-ad-interest.test.mjs
          deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-interest/index.ts

      - name: Verify CRM public plan offers and approved grace terms never charge
        run: node --test tests/crm-assisted-sales-and-grace-terms.test.mjs

      - name: Verify operator-approved 7-day CRM grace remains manual review only
        run: node --test tests/crm-asaas-approved-grace-policy.test.mjs

      - name: Verify production Asaas past-due grace is advisory and never cuts customers
        run: node --test tests/crm-asaas-production-delinquency.test.mjs

      - name: Verify production Asaas cancellation, refund and renewal preview is read-only
        run: node --test tests/crm-asaas-production-lifecycle-readonly.test.mjs

      - name: Verify Asaas production claim and one-time worker lease (no charges)
        run: node --test tests/crm-asaas-production-provisioner-hardoff.test.mjs

      - name: Verify Asaas production receipt inspector remains read-only and hard OFF
        run: node --test tests/crm-asaas-production-verify-readonly.test.mjs

      - name: Verify isolated production Asaas checkout is hard OFF (no charges)
        run: node --test tests/crm-asaas-production-checkout.test.mjs

      - name: Verify production Asaas monthly decisions without payments or network
        run: node --test tests/crm-asaas-production-preview.test.mjs

      - name: Test Asaas Pix and boleto monthly pipeline (offline, no charges)
        run: node --test tests/crm-asaas-*.test.mjs

      - name: Test admin CRM trial 15/30 days (fail closed)
        run: node --test tests/crm-admin-trial.test.mjs tests/crm-trial-expiry.test.mjs tests/crm-trial-release-gates.test.mjs

      - name: Verify CRM commercial launch gates without a real transaction
        run: |
          node --test tests/crm-commercial-readiness.test.mjs tests/crm-trial-to-paid-preflight.test.mjs
          node scripts/crm-commercial-readiness.mjs

      - name: Verify temporary read-only Asaas Sandbox credential probe
        run: node --test tests/crm-asaas-sandbox-probe.test.mjs

      - name: Test Asaas Sandbox webhook isolated inbox (no billing)
        run: node --test tests/crm-asaas-sandbox-inbox.test.mjs

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare

  sql_isolated:
    name: Billing and trials PostgreSQL 17 isolated assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: nexus_crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test settlement, trial and concurrency SQL without customer data
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: nexus_crm_ci
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_billing_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107110000_crm_live_pix_ten_real_pilot.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_live_pix_pilot_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_PUBLIC_MONTHLY_CROSS_PROVIDER_UNIQUE_SQL.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_cross_provider_monthly_identity_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_ASAAS_SETTLEMENT_RESERVATION_SQL_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_ASAAS_PAYMENT_CLAIM_SQL_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_TRIAL_CLAIM_SQL_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_billing_assertions.sql
          bash tests/sql/crm_billing_concurrency.sh
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_ASAAS_LIFECYCLE_SQL_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_lifecycle_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_lifecycle_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/CRM_ASAAS_PROVISION_LEASE_SQL_DRAFT.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_asaas_provision_lease_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107170000_crm_asaas_prepaid_expiry.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_asaas_prepaid_expiry_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107220000_crm_asaas_production_webhook_inbox.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_asaas_production_events_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107223000_crm_asaas_production_settlement.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_asaas_production_settlement_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261107233000_crm_asaas_production_renewal.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/crm_asaas_production_renewal_assertions.sql
