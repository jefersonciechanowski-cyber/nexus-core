name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run security checks
        run: npm run security:check

      - name: Test CRM monthly checkout contract (no charges)
        run: node --test tests/crm-monthly-checkout.test.mjs tests/crm-monthly-checkout-bridge.test.mjs tests/crm-asaas-monthly-contract.test.mjs tests/crm-asaas-monthly-events.test.mjs tests/crm-asaas-monthly-endpoint.test.mjs tests/crm-asaas-reconciliation.test.mjs tests/crm-asaas-provider-verification.test.mjs tests/crm-asaas-reservation.test.mjs tests/crm-shared-sale-provisioning.test.mjs tests/crm-admin-trial.test.mjs

      - name: Setup Deno for subscription checkout
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck CRM public Stripe function
        run: deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-monthly-checkout/index.ts supabase/functions/nexus-public-crm-monthly-asaas/index.ts supabase/functions/nexus-crm-asaas-monthly-events/index.ts supabase/functions/nexus-crm-asaas-verify-event/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/_shared/nexus-sale-provisioning.ts supabase/functions/nexus-admin-crm-trial/index.ts

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare
