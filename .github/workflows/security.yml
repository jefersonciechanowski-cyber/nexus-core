name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run security checks
        run: npm run security:check

      - name: Check CRM demo intake contract
        run: node --test tests/crm-demo-intake.test.mjs

      - name: Set up Deno for CRM Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check CRM intake Edge Function syntax and imports
        run: deno check --node-modules-dir=auto supabase/functions/nexus-public-crm-intake/index.ts

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare
