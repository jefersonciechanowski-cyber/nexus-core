name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run security checks
        run: npm run security:check

      - name: Validate Nexus CRM Stripe monthly checkout without payments
        run: node --test tests/crm-monthly-checkout.test.mjs tests/crm-monthly-checkout-bridge.test.mjs tests/crm-stripe-first-checkout.test.mjs

      - name: Test HMAC diagnostic without payments
        run: node --test tests/crm-bridge-diagnostic.test.mjs

      - name: Test Asaas Pix and boleto monthly pipeline (offline, no charges)
        run: node --test tests/crm-asaas-*.test.mjs

      - name: Build Cloudflare artifact
        run: npm run build:cloudflare
