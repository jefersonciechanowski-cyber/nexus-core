name: Central stored artifact offline recovery (no production connection)

on:
  workflow_run:
    workflows: ["Central encrypted backup & isolated real restore (GitHub only)"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: central-stored-artifact-restore
  cancel-in-progress: false

jobs:
  offline_recover_stored_artifact:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CENTRAL_BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.CENTRAL_BACKUP_ENCRYPTION_PASSWORD }}
    steps:
      - name: Checkout reviewed offline validation scripts without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download, decrypt and independently restore latest successful encrypted Central artifact
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${CENTRAL_BACKUP_ENCRYPTION_PASSWORD:-}" || { echo 'BLOCKED: encryption secret is not configured'; exit 1; }
          work="$(mktemp -d)"
          name="central-stored-dr-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          started="$(date +%s)"

          if [ "${GITHUB_EVENT_NAME}" = 'workflow_run' ]; then
            run_id="${{ github.event.workflow_run.id }}"
            source_branch="${{ github.event.workflow_run.head_branch }}"
            [ "$source_branch" = 'main' ] || { echo 'BLOCKED: source backup was not produced on main'; exit 1; }
          else
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/central-real-restore-drill.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'FAIL: no successful Central backup run found'; exit 1; }

          mkdir -p "$work/artifact" "$work/recovered"
          if ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" --name "central-validated-encrypted-backup-$run_id" --dir "$work/artifact" > "$work/download.log" 2>&1; then
            echo 'FAIL: encrypted Central artifact could not be downloaded'
            exit 1
          fi
          encrypted="$work/artifact/central-verified-$run_id.tar.gz.gpg"
          test -s "$encrypted" || { echo 'FAIL: encrypted artifact archive is absent'; exit 1; }
          ( cd "$work/artifact" && sha256sum -c "$(basename "$encrypted").sha256" > /dev/null ) || { echo 'FAIL: stored encrypted checksum mismatch'; exit 1; }

          printf '%s' "$CENTRAL_BACKUP_ENCRYPTION_PASSWORD" > "$work/passphrase"
          chmod 600 "$work/passphrase"
          unset CENTRAL_BACKUP_ENCRYPTION_PASSWORD
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase-file "$work/passphrase" --decrypt --output "$work/package.tar.gz" "$encrypted" > "$work/decrypt.log" 2>&1; then
            echo 'FAIL: encrypted backup cannot be decrypted'
            exit 1
          fi
          # Refuse tar symlinks, traversal, hidden files, unexpected names or duplicates.
          python3 - "$work/package.tar.gz" "$work/recovered" <<'PY'
          from pathlib import Path
          import sys, json, tarfile, re
          archive, dest = Path(sys.argv[1]), Path(sys.argv[2])
          fixed = {
              "central.dump", "sequence-acl.sql", "source-integrity.csv",
              "security-digest.txt", "captured-utc.txt",
              "source-storage-inventory.json", "storage/manifest.json"
          }
          with tarfile.open(archive, "r:gz") as tf:
              members = tf.getmembers()
              if len(members) > 1010 or len({m.name for m in members}) != len(members):
                  raise SystemExit("FAIL: archive duplication or excessive file count")
              by_name = {m.name: m for m in members}
              if "storage/manifest.json" not in by_name or by_name["storage/manifest.json"].size > 1024 * 1024:
                  raise SystemExit("FAIL: missing or excessive Storage manifest")
              try:
                  manifest = json.loads(tf.extractfile(by_name["storage/manifest.json"]).read())
                  blobs = {
                      "storage/blobs/" + entry["blob"] for entry in manifest["objects"]
                  }
                  if (manifest["version"] != 1 or manifest["bucket"] != "sst-documents"
                      or len(blobs) != len(manifest["objects"])
                      or len(blobs) > 1000
                      or not all(re.fullmatch(r"storage/blobs/[0-9a-f]{64}", b) for b in blobs)):
                      raise ValueError("unsafe Storage manifest")
              except (ValueError, KeyError, TypeError, AttributeError):
                  raise SystemExit("FAIL: invalid stored Storage manifest")
              expected = fixed | blobs
              file_names = {m.name for m in members if m.isfile()}
              dirs = {m.name for m in members if m.isdir()}
              if (file_names != expected or not dirs.issubset({"storage", "storage/blobs"})
                  or any(not (m.isfile() or m.isdir()) for m in members)
                  or sum(m.size for m in members) > 300 * 1024 * 1024):
                  raise SystemExit("FAIL: unexpected recovery archive member")
              for member in members:
                  if not member.isfile():
                      continue
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit("FAIL: unreadable recovery member")
                  target = dest / member.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open("xb") as output:
                      remaining = member.size
                      while remaining > 0:
                          data = source.read(min(65536, remaining))
                          if not data:
                              raise SystemExit("FAIL: truncated recovery member")
                          output.write(data)
                          remaining -= len(data)
          PY
          test "$(head -c 5 "$work/recovered/central.dump")" = "PGDMP" || { echo 'FAIL: invalid PostgreSQL custom dump'; exit 1; }
          grep -Eq '^[0-9a-f]{32}$' "$work/recovered/security-digest.txt" || { echo 'FAIL: source security digest missing'; exit 1; }
          test -s "$work/recovered/source-integrity.csv" || { echo 'FAIL: saved source operational metrics absent'; exit 1; }
          test -s "$work/recovered/sequence-acl.sql" || { echo 'FAIL: saved source sequence ACL manifest absent'; exit 1; }

          docker run -d --rm --network none --name "$name" -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=central_restore postgres:17 >/dev/null
          [ "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$name")" = 'none' ] || { echo 'FAIL: restore container must have no network'; exit 1; }
          for i in $(seq 1 90); do
            if docker exec "$name" psql -U postgres -d central_restore -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1; then break; fi
            sleep 1
          done
          docker exec "$name" psql -U postgres -d central_restore -Atqc 'SELECT 1' | grep -qx 1

          for role in anon authenticated authenticator service_role supabase_auth_admin supabase_storage_admin supabase_admin dashboard_user supabase_read_only_user supabase_realtime_admin supabase_replication_admin; do
            docker exec "$name" psql -U postgres -d central_restore -v ON_ERROR_STOP=1 -c "CREATE ROLE $role NOLOGIN" >/dev/null
          done
          docker exec "$name" psql -U postgres -d central_restore -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE' >/dev/null
          docker exec "$name" psql -U postgres -d central_restore -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;' >/dev/null
          docker cp "$work/recovered/central.dump" "$name:/tmp/central.dump" >/dev/null
          if ! docker exec "$name" pg_restore -U postgres -d central_restore --single-transaction --exit-on-error /tmp/central.dump > "$work/restore.log" 2>&1; then
            echo 'FAIL: independent offline pg_restore failed; raw diagnostics suppressed'
            python3 scripts/classify-central-restore-error.py "$work/restore.log"
            exit 1
          fi
          docker cp "$work/recovered/sequence-acl.sql" "$name:/tmp/sequence-acl.sql" >/dev/null
          if ! docker exec "$name" psql -U postgres -d central_restore -X -q -v ON_ERROR_STOP=1 -f /tmp/sequence-acl.sql > "$work/replay.log" 2>&1; then
            echo 'FAIL: independent offline SQL GRANT replay failed'
            exit 1
          fi
          docker cp scripts/central-restore-security-fingerprint.sql "$name:/tmp/security.sql" >/dev/null
          restored_digest="$(docker exec "$name" psql -U postgres -d central_restore -X -A -t -q -v ON_ERROR_STOP=1 -f /tmp/security.sql 2> "$work/security.err" | tr -d '\r\n')"
          stored_digest="$(tr -d '\r\n' < "$work/recovered/security-digest.txt")"
          [ "$restored_digest" = "$stored_digest" ] || { echo 'FAIL: stored backup security fingerprint differs'; exit 1; }

          docker cp scripts/central-restore-integrity.sql "$name:/tmp/integrity.sql" >/dev/null
          docker exec "$name" psql -U postgres -d central_restore -X -A -t -q -v ON_ERROR_STOP=1 -f /tmp/integrity.sql > "$work/actual-integrity.csv" 2> "$work/integrity.err"
          python3 scripts/central-integrity-safe-diagnostics.py verify "$work/recovered/source-integrity.csv" "$work/actual-integrity.csv" || { echo 'FAIL: offline restored operational state mismatch'; exit 1; }

          # Reconstruct and hash-check every private Storage object from stored
          # encrypted bytes, matched to the RESTORED database Storage metadata.
          # Never connect to production or publish decrypted objects.
          docker cp scripts/central-storage-inventory.sql "$name:/tmp/storage-inventory.sql" >/dev/null
          docker exec "$name" psql -U postgres -d central_restore \
            -X -A -t -q -v ON_ERROR_STOP=1 -f /tmp/storage-inventory.sql \
            > "$work/actual-storage-inventory.json"
          python3 scripts/central-storage-backup.py verify \
            "$work/recovered/source-storage-inventory.json" \
            "$work/actual-storage-inventory.json" "$work/recovered/storage" || {
            echo 'FAIL: independently recovered private Storage objects did not match'
            exit 1
          }
          if awk -F'|' '$1=="link_integrity" && $3+0>0 {bad=1} END {exit !bad}' "$work/actual-integrity.csv"; then
            echo 'FAIL: restored copy contains broken links'
            exit 1
          fi

          # Deliberately fake, non-member JWT must see ZERO Central organizations.
          if ! docker exec "$name" psql -U postgres -d central_restore -X -A -t -q -v ON_ERROR_STOP=1 -c "BEGIN; SET LOCAL ROLE authenticated; SET LOCAL request.jwt.claim.sub = '00000000-0000-0000-0000-000000000099'; SELECT count(*) FROM public.organizations; ROLLBACK;" > "$work/rls-probe.txt" 2> "$work/rls-probe.err"; then
            echo 'FAIL: isolated negative tenant RLS probe could not complete'
            exit 1
          fi
          [ "$(tr -d '\r\n' < "$work/rls-probe.txt")" = '0' ] || { echo 'FAIL: isolated negative tenant RLS probe leaked organizations'; exit 1; }

          # Functional checks only on the offline, network-disconnected restored DB.
          # Test one real org-admin in authenticated role and compare billing links.
          # Outputs and errors remain private in runner temp; no user IDs in logs.
          docker cp scripts/central-restore-functional-acceptance.sql "$name:/tmp/functional-acceptance.sql" >/dev/null
          if ! docker exec "$name" psql -U postgres -d central_restore -X -q -v ON_ERROR_STOP=1 \
            -f /tmp/functional-acceptance.sql > "$work/functional.log" 2>&1; then
            echo 'FAIL: isolated organization-admin RLS or billing-link acceptance test failed'
            exit 1
          fi
          echo 'PASS: restored actual organization-admin RLS and read-only billing-link checks'

          python3 - "$work/recovered/captured-utc.txt" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          try:
              captured = datetime.fromisoformat(Path(sys.argv[1]).read_text().strip().replace("Z", "+00:00"))
              seconds = (datetime.now(timezone.utc) - captured).total_seconds()
              if seconds < -300:
                  raise ValueError("future snapshot")
          except (ValueError, OSError):
              raise SystemExit("FAIL: invalid snapshot timestamp")
          print("observed_snapshot_age_minutes=" + str(max(0, round(seconds / 60))))
          PY
          echo 'PASS: stored encrypted Central artifact independently decrypted and restored with no production connection'
          echo "source_backup_run=$run_id"
          echo "isolated_network_mode=none"
          echo "isolated_negative_tenant_probe=passed"
          echo "recovery_lab_seconds=$(($(date +%s)-started))"
          echo 'external_notifications_and_charges=0'
          echo 'limitations=no external Auth login, live payments, Storage service reupload or disaster RTO/RPO certification'
