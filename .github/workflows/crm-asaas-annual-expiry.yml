name: CRM annual prepaid expiry

on:
  schedule:
    - cron: '19 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  expire_annual:
    if: vars.NEXUS_CRM_ASAAS_PROD_ANNUAL_EXPIRY_WORKFLOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request annual expiry GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-crm-asaas-annual-expiry")"
          TOKEN="$(printf '%s' "${RESULT}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          printf 'token=%s\n' "${TOKEN}" >> "${GITHUB_OUTPUT}"
      - name: Expire only paid annual CRM access
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-asaas-annual-expiry" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          printf '%s' "${RESULT}" | python3 -c 'import json,sys; r=json.load(sys.stdin); ok=r.get("pending_review")==0 and r.get("suspended")==r.get("synced");print("CRM annual expiry verified" if ok else "CRM annual expiry review required");sys.exit(0 if ok else 1)'
