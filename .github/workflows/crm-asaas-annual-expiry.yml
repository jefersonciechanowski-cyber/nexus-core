name: CRM annual prepaid expiry

on:
  schedule:
    - cron: '19 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  expire_annual:
    if: vars.NEXUS_CRM_ASAAS_PROD_ANNUAL_EXPIRY_WORKFLOW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request annual expiry GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-crm-asaas-annual-expiry")"
          TOKEN="$(printf '%s' "${RESULT}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          printf 'token=%s\n' "${TOKEN}" >> "${GITHUB_OUTPUT}"
      - name: Expire only paid annual CRM access
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT
          HTTP="$(curl --silent --show-error --max-time 45 \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-asaas-annual-expiry" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --output "${BODY_FILE}" --write-out '%{http_code}' \
            --data '{}')"
          python3 - "${HTTP}" "${BODY_FILE}" <<'PY'
          import json
          import sys
          http, path = sys.argv[1:]
          try:
              with open(path, encoding='utf8') as f:
                  data = json.load(f)
          except (OSError, ValueError):
              print('Annual expiry: invalid backend response')
              sys.exit(1)
          if http == '503' and data.get('error') == 'Expiração anual em homologação.':
              print('Annual expiry: backend release gate is closed; no changes')
              sys.exit(0)
          if http == '200' and type(data.get('pending_review')) is int and data['pending_review'] == 0 and type(data.get('suspended')) is int and type(data.get('synced')) is int and data['suspended'] == data['synced']:
              print('Annual expiry: completed and CRM entitlement reconciled')
              sys.exit(0)
          print('Annual expiry: backend or entitlement delivery requires review (HTTP ' + http + ')')
          sys.exit(1)
          PY
