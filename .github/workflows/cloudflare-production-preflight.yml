name: Cloudflare production credentials preflight (no deploy)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN_2: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check whether Cloudflare deployment credentials are available (never print values)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN_1}" ] && [ -n "${CF_ACCOUNT_1}" ]; then
            echo 'Cloudflare credential pair CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID: available'
          elif [ -n "${CF_TOKEN_2}" ] && [ -n "${CF_ACCOUNT_2}" ]; then
            echo 'Cloudflare credential pair CF_API_TOKEN + CF_ACCOUNT_ID: available'
          else
            echo 'Cloudflare deploy credentials not configured for this repository.'
            echo 'No production change made.'
          fi
