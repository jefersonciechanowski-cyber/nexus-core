name: Nexus Admin live management interface (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/nexus-admin/**'
      - '.github/workflows/nexus-admin-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate official Nexus Central HTML, styles and pilot plan selection
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nexuscore.app.br/apps/nexus-admin'
          for RESOURCE in 'index.html' 'pilot.js' 'admin-management.css'; do
            CODE="$(curl --silent --show-error --location --max-time 20 --output "/tmp/${RESOURCE##*/}" --write-out '%{http_code}' "${ORIGIN}/${RESOURCE}")"
            echo "Nexus Admin ${RESOURCE}: HTTP ${CODE}"
          done
          grep -q 'newPilotShortcut' /tmp/index.html && echo 'LIVE index contains management dashboard' || echo 'LIVE index is still old'
          grep -q 'pilotTargetPlan' /tmp/pilot.js && echo 'LIVE pilot contains tier picker' || echo 'LIVE pilot is still old'
          PAGECSS="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' 'https://jefersonciechanowski-cyber.github.io/nexus-core/apps/nexus-admin/admin-management.css')"
          echo "GitHub Pages origin CSS: HTTP ${PAGECSS}"
          grep -q 'newPilotShortcut' /tmp/index.html
          grep -q 'admin-management.css' /tmp/index.html
          grep -q 'href="accounts.html"' /tmp/index.html
          grep -q 'pilotTargetPlan' /tmp/pilot.js
          grep -q 'profissional' /tmp/pilot.js
          grep -q '.work-queue' /tmp/admin-management.css
          echo 'Nexus Admin management shell and SST tier picker are live; no login or payments used.'
