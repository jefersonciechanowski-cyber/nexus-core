name: Nexus Admin live management interface (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/nexus-admin/**'
      - '.github/workflows/nexus-admin-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live_admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate official Nexus Central HTML, styles and pilot plan selection
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://nexuscore.app.br/apps/nexus-admin'
          for RESOURCE in 'index.html' 'pilot.js' 'admin-management.css'; do
            CODE="$(curl --silent --show-error --location --max-time 20 --output "/tmp/${RESOURCE##*/}" --write-out '%{http_code}' "${ORIGIN}/${RESOURCE}")"
            echo "Nexus Admin ${RESOURCE}: HTTP ${CODE}"
          done
          grep -q 'newPilotShortcut' /tmp/index.html && echo 'LIVE index contains management dashboard' || echo 'LIVE index is still old'
          grep -q 'pilotTargetPlan' /tmp/pilot.js && echo 'LIVE pilot contains tier picker' || echo 'LIVE pilot is still old'
          PAGECSS="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' 'https://jefersonciechanowski-cyber.github.io/nexus-core/apps/nexus-admin/admin-management.css')"
          echo "GitHub Pages origin CSS: HTTP ${PAGECSS}"
          grep -q 'newPilotShortcut' /tmp/index.html
          grep -q 'admin-management.css' /tmp/index.html
          grep -q 'href="accounts.html"' /tmp/index.html
          grep -q 'pilotTargetPlan' /tmp/pilot.js
          grep -q 'profissional' /tmp/pilot.js
          grep -q '.work-queue' /tmp/admin-management.css
          echo 'Nexus Admin management shell and SST tier picker are live; no login or payments used.'
          # Distinguish an updated repository from a stale official-domain deployment.
          # This probe never authenticates and only reads public static assets.
          STYLE_CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/central-nexus-style.css --write-out '%{http_code}' "${ORIGIN}/central-nexus-v2.css?release=${GITHUB_SHA}")"
          if [ "$STYLE_CODE" = '200' ] && grep -q 'CENTRAL_NAV_STABILITY_RELEASE_20261122' /tmp/central-nexus-style.css; then
            echo 'Official Central CSS includes the latest stability release marker.'
          else
            echo '::warning::Official Central CSS has not yet synchronized with this GitHub release.'
          fi
          python3 - <<'PY'
          import re
          with open('/tmp/index.html', encoding='utf-8') as source:
              html = source.read()
          nav = re.search(r'<nav class="nav"[^>]*>(.*?)</nav>', html, re.S)
          if nav and 'CRM Comercial' in nav.group(1):
              print('::warning::Legacy CRM Comercial navigation is still served on the official domain.')
          else:
              print('Official Central HTML has no CRM Comercial navigation entry.')
          PY
          # Observe canonical path headers. No authentication, tokens or customer data.
          # Cloudflare may redirect accounts.html to accounts (without extension).
          for RESOURCE in accounts crm-access; do
            curl --silent --show-error --location --head --max-time 20 \
              "${ORIGIN}/${RESOURCE}.html?embedded=1" > "/tmp/nexus-${RESOURCE}-headers.txt"
            if grep -qi '^x-frame-options: sameorigin' "/tmp/nexus-${RESOURCE}-headers.txt" && \
               grep -qi "frame-ancestors 'self'" "/tmp/nexus-${RESOURCE}-headers.txt"; then
              echo "Admin embedded route ${RESOURCE}: SAMEORIGIN and CSP self"
            else
              echo "::warning::Admin embedded route ${RESOURCE}: response headers may still block embedding."
              grep -iE '^x-frame-options:|^content-security-policy:' "/tmp/nexus-${RESOURCE}-headers.txt" | cut -c 1-180 || true
            fi
          done

          # Verify SST courtesy is actually served on the official Central domain.
          # Status is observational: Cloudflare deployments can lag behind Git.
          LIVE_COURTESY_CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/nexus-live-courtesy.html --write-out '%{http_code}' "${ORIGIN}/crm-access?embedded=1&release=${GITHUB_SHA}")"
          if [ "$LIVE_COURTESY_CODE" = '200' ] && \
             grep -q 'id="sstCourtesyForm"' /tmp/nexus-live-courtesy.html && \
             grep -q 'data-courtesy-view="sst"' /tmp/nexus-live-courtesy.html; then
            echo 'SST_COURTESY_OFFICIAL=LIVE'
          else
            echo '::warning::SST_COURTESY_OFFICIAL=STALE_OR_UNAVAILABLE'
            echo "Official courtesy route HTTP ${LIVE_COURTESY_CODE}; deployment may need synchronization."
          fi
          LIVE_ADMIN_CODE="$(curl --silent --show-error --location --max-time 20 --output /tmp/nexus-live-index.html --write-out '%{http_code}' "${ORIGIN}/index.html?release=${GITHUB_SHA}")"
          if [ "$LIVE_ADMIN_CODE" = '200' ] && grep -q 'Cortesias CRM e SST' /tmp/nexus-live-index.html; then
            echo 'SST_COURTESY_NAV=LIVE'
          else
            echo '::warning::SST_COURTESY_NAV=STALE_OR_UNAVAILABLE'
          fi
          # Verify the canonical pages return actual existing form markup (no auth or writes).
          for RESOURCE in accounts crm-access; do
            CODE="$(curl --silent --show-error --location --max-time 25 --output "/tmp/nexus-${RESOURCE}-body.html" --write-out '%{http_code}' "${ORIGIN}/${RESOURCE}?embedded=1")"
            FORM='accountForm'
            [ "$RESOURCE" = "crm-access" ] && FORM='courtesyForm'
            if [ "$CODE" = '200' ] && grep -q "id=\"$FORM\"" "/tmp/nexus-${RESOURCE}-body.html"; then
              echo "Central embedded ${RESOURCE}: canonical HTML has expected form"
            else
              echo "::warning::Central embedded ${RESOURCE}: unexpected HTTP ${CODE} or form markup missing"
            fi
          done
