name: PR53 site app links

on:
  push:
    branches:
      - feat/nexus-sst-pwa-v1

permissions:
  contents: write

jobs:
  adjust-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nexus-sst-pwa-v1
      - name: Adjust app links
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/site-captacao/index.html')
          s = p.read_text(encoding='utf-8')

          old_header = '<header class="header"><div class="container header-inner"><a href="#inicio"><img class="logo" src="../sst-controle/logo-nexus-core.png" alt="Nexus Core"></a><nav class="nav"><a href="#recursos">Recursos</a><a href="#tour">Conheça o sistema</a><a href="#planos">Planos</a><a href="#demonstracao">Demonstração</a><a href="#faq">Dúvidas</a></nav><div class="actions"><a class="btn btn-ghost" href="../portal-cliente/login.html">Já sou cliente</a><a class="btn btn-app" href="../sst-controle/instalar.html">Instalar app</a><a class="btn btn-primary" href="#planos">Ver planos</a></div></div></header>'
          new_header = '<header class="header"><div class="container header-inner"><a href="#inicio"><img class="logo" src="../sst-controle/logo-nexus-core.png" alt="Nexus Core"></a><nav class="nav"><a href="#recursos">Recursos</a><a href="#tour">Conheça o sistema</a><a href="#planos">Planos</a><a href="#demonstracao">Demonstração</a><a href="#faq">Dúvidas</a><a class="nav-app" href="../sst-controle/instalar.html">Aplicativo</a></nav><div class="actions"><a class="header-app-link" href="../sst-controle/instalar.html">Aplicativo</a><a class="btn btn-ghost" href="../portal-cliente/login.html">Já sou cliente</a><a class="btn btn-primary" href="#planos">Ver planos</a></div></div></header>'

          old_hero = '<div class="hero-actions"><a class="btn btn-primary" href="#planos">Contratar agora</a><a class="btn" href="#tour">Conhecer o Nexus SST</a><a class="btn btn-app" href="../sst-controle/instalar.html">Instalar Nexus SST</a></div>'
          new_hero = '<div class="hero-actions"><a class="btn btn-primary" href="#planos">Contratar agora</a><a class="btn" href="#tour">Conhecer o Nexus SST</a></div>'

          old_mobile = '<div class="mobile-access-bar" aria-label="Ações rápidas"><a class="btn btn-ghost" href="../portal-cliente/login.html">Já sou cliente</a><a class="btn btn-app" href="../sst-controle/instalar.html">Instalar app</a><a class="btn btn-primary" href="#planos">Ver planos</a></div>'
          new_mobile = '<div class="mobile-access-bar" aria-label="Ações rápidas"><a class="btn btn-ghost" href="../portal-cliente/login.html">Já sou cliente</a><a class="btn btn-primary" href="#planos">Ver planos</a></div>'

          for old, new, label in [(old_header,new_header,'header'),(old_hero,new_hero,'hero'),(old_mobile,new_mobile,'mobile')]:
              if old not in s:
                  raise SystemExit(f'Expected {label} markup not found')
              s = s.replace(old,new,1)

          extra_css = '''\n    .nav-app{color:#9fc9ad!important}.header-app-link{display:none;color:#9fc9ad;font-size:12px;font-weight:650;padding:7px 3px}.header-app-link:hover{color:#fff}\n    @media(max-width:980px){.header-app-link{display:inline-flex}}\n    @media(max-width:680px){.header-app-link{font-size:10px;padding-inline:2px}.mobile-access-bar{grid-template-columns:repeat(2,1fr)!important}}\n'''
          if extra_css.strip() not in s:
              s = s.replace('</style>', extra_css + '  </style>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit adjustment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site-captacao/index.html
          git commit -m "fix: make app access discreet on capture site"
          git push origin HEAD:feat/nexus-sst-pwa-v1
