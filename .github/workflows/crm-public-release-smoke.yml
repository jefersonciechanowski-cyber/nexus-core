name: CRM public self-service release smoke (read-only)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  public_gate_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live public endpoints without submissions, identities or charges
        shell: bash
        run: |
          set -euo pipefail
          code() {
            curl --silent --show-error --location-trusted --max-time 12 \
              --output /dev/null --write-out '%{http_code}' "$1"
          }
          origin='https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1'
          trial="$(code "$origin/nexus-public-crm-trial-request")"
          activate="$(code "$origin/nexus-public-crm-trial-activate")"
          annual="$(code "$origin/nexus-public-crm-annual-bf-asaas-production")"
          annual_expiry="$(code "$origin/nexus-crm-asaas-annual-expiry")"
          trial_expiry="$(code "$origin/nexus-crm-trial-reconcile")"
          site="$(code 'https://crm.nexuscore.app.br/site-captacao')"
          if [[ "$site" != '200' ]]; then
            echo "::error::CRM commercial page HTTP $site"
            exit 1
          fi
          for check in "trial:$trial" "activation:$activate" "annual:$annual" "annual_expiry:$annual_expiry" "trial_expiry:$trial_expiry"; do
            name="${check%%:*}"
            http="${check#*:}"
            case "$http" in
              503) echo "$name: release gate CLOSED (503)" ;;
              403|401|405) echo "$name: gate may be open, protected endpoint rejected unauthenticated GET ($http)" ;;
              *) echo "::error::$name unexpected HTTP $http"; exit 1 ;;
            esac
          done
          echo 'Commercial site reachable; no forms, payments or accounts were created.'

      - name: Check configured trial and annual flags via authenticated read-only production probe
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 10 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-crm-public-release-preflight")"
          TOKEN="$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          BODY="$(curl --fail-with-body --silent --show-error --max-time 15 \
            --request GET \
            --url 'https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-public-release-preflight' \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Accept: application/json')"
          printf '%s' "${BODY}" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d.get("status")=="preflight" and d.get("readOnly") is True
          for key in ("createdCharge","createdAccount","sentEmail","customerDataRead"):
              assert d.get(key) is False
          t=d["trial"];a=d["annual"]
          print("TRIAL: fingerprintConfigured=%s, flagsDefined=%s, releaseReady=%s" % (
              t["fingerprintConfigured"],",".join(t["flags"]["declared"]),t["ready"]))
          print("ANNUAL: bridgeConfigured=%s, workerConfigured=%s, providerConfigured=%s, flagsDefined=%s, releaseReady=%s" % (
              a["bridgeConfigured"],a["workerConfigured"],a["providerConfigured"],
              ",".join(a["flags"]["declared"]),a["ready"]))
          print("Email transport configured: %s" % d["emailTransportConfigured"])
          '
