name: Central DR Windows PowerShell 5.1 source compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/central-restore-windows-powershell.yml'
      - 'scripts/central-restore-drill.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/central-restore-windows-powershell.yml'
      - 'scripts/central-restore-drill.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  winps_51_syntax_and_safety:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout Central recovery script without saved GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse and check guardrails in built-in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Must run Windows PowerShell 5.1.' }
          $scriptPath = Join-Path (Get-Location).Path 'scripts/central-restore-drill.ps1'
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ('PowerShell 5.1 parser rejected recovery script. Error count: ' + $parseErrors.Count)
          }
          $content = Get-Content -LiteralPath $scriptPath -Raw
          foreach ($required in @('--network','none','PGPASSWORD','PGSSLMODE','default_transaction_read_only=on','security_digest_match','CENTRAL_DR_TEST_REVOKE_ACL')) {
            if (-not $content.Contains($required)) { throw ('Expected recovery safeguard missing: ' + $required) }
          }
          foreach ($forbidden in @('--no-owner','--no-privileges','--dbname="$CENTRAL_SOURCE_DATABASE_URL"')) {
            if ($content.Contains($forbidden)) { throw 'Recovery script contains unsafe or incomplete backup arguments.' }
          }
          Write-Output 'PASS: Windows PowerShell 5.1 syntax and recovery safety guards'
