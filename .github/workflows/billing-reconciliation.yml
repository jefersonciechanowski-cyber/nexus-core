name: Billing reconciliation

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-billing-reconcile")"
          TOKEN="$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          printf 'token=%s\n' "${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Reconcile Stripe contracts and pending CRM revisions
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --request POST             --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-billing-reconcile"             --header "Authorization: Bearer ${OIDC_TOKEN}"             --header "Content-Type: application/json"             --data '{}')"
          printf '%s\n' "${RESPONSE}"
          printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; body=json.load(sys.stdin); ok=body.get("ok") is True; print("Billing reconciliation ok=true" if ok else "Billing reconciliation returned ok=false", file=sys.stderr if not ok else sys.stdout); sys.exit(0 if ok else 1)'
