name: CRM Asaas production inbox monitor

on:
  # Execute a single real connectivity probe when this file is updated on main.
  # This path filter does not apply to checkout, sales or finance code.
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-asaas-production-dispatch.yml'
  schedule:
    - cron: '37 */6 * * *' # diagnóstico barato, independente da liberação
    - cron: '*/5 * * * *' # processamento apenas após habilitação explícita
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: crm-asaas-production-inbox-monitor
  cancel-in-progress: false

jobs:
  inspect_inbox_only:
    # O gatilho de 5 minutos não usa runner quando a função financeira está fechada.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '37 */6 * * *' || vars.NEXUS_CRM_ASAAS_PROD_FINANCIAL_WORKFLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request single-use GitHub OIDC token for the CRM inbox monitor
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexus-crm-asaas-production-dispatch")"
          TOKEN="$(printf '%s' "${RESPONSE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${TOKEN}"
          printf 'token=%s\n' "${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Inspect Asaas CRM production inbox without financial mutations
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-asaas-production-dispatch" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"action":"inspect"}')"
          printf '%s\n' "${RESPONSE}" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("status")=="inspected" and d.get("readOnly") is True and d.get("createdCharge") is False and d.get("accessGranted") is False and d.get("financialDispatchEnabled") is False; print("CRM Asaas inbox: pending=%s manual_review=%s, zero financial side effects" % (d.get("pending"),d.get("manualReview")) if ok else "CRM Asaas inbox monitor returned unsafe or unexpected state"); sys.exit(0 if ok else 1)'

      - name: Check first-customer release readiness without charges
        # Safe on push, schedule and manual execution: readonly Asaas GET only.
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-asaas-production-dispatch" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"action":"readiness"}')"
          printf '%s\n' "${RESPONSE}" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("status")=="preflight" and d.get("readOnly") is True and d.get("createdCharge") is False and d.get("accessGranted") is False and isinstance(d.get("flagsPending"),list) and isinstance(d.get("secretsPending"),list); print("CRM Asaas first-customer ready=%s; plans public=%s; webhook=%s; pending flags=%s; missing keys=%s; bridge=%s" % (d.get("readyToReceiveFirstCustomer"),d.get("plansReady"),d.get("webhookStatus"),",".join(d.get("flagsPending",[])),",".join(d.get("secretsPending",[])),d.get("bridgeStatus")) if ok else "Readiness response rejected"); sys.exit(0 if ok else 1)'

      - name: Dispatch verified CRM Asaas events only after independent release approval
        if: ${{ vars.NEXUS_CRM_ASAAS_PROD_FINANCIAL_WORKFLOW_ENABLED == 'true' && github.event_name != 'push' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 180 \
            --request POST \
            --url "https://svphwbccqeoakpmcpvhy.supabase.co/functions/v1/nexus-crm-asaas-production-dispatch" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"action":"dispatch"}')"
          printf '%s\n' "${RESPONSE}" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("status")=="dispatch_attempt" and d.get("createdCharge") is False and all(type(d.get(k)) is int and d[k]>=0 for k in ("inspected","completed","manualReview","retry")); print("CRM Asaas: inspected=%s completed=%s review=%s retry=%s; no charges created" % (d.get("inspected"),d.get("completed"),d.get("manualReview"),d.get("retry")) if ok else "CRM Asaas financial dispatcher returned an unexpected or unsafe response"); sys.exit(0 if ok else 1)'
