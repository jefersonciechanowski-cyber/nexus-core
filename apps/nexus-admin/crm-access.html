<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071015">
  <title>Nexus CRM | Central Nexus</title>
  <style>
    :root{--bg:#081014;--surface:#111a1f;--line:#2f393f;--text:#f5eee0;--muted:#98a2a7;--gold:#e0b84a;--good:#72a875;--danger:#dc6c67}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#070d11,#0a1419);color:var(--text)}button,input,select{font:inherit}.shell{max-width:1200px;margin:0 auto;padding:28px 22px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top p{margin:7px 0 0;color:var(--muted)}.back{color:var(--gold);text-decoration:none;font-size:13px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.search{width:min(360px,100%);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#0b1419;color:var(--text)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}th{background:#162127;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700}.good{background:rgba(114,168,117,.15);color:#91c094}.bad{background:rgba(220,108,103,.14);color:#ec8d88}.warn{background:rgba(224,184,74,.14);color:var(--gold)}.action{border:1px solid var(--line);background:#0d171c;color:var(--text);padding:8px 10px;border-radius:7px;cursor:pointer}.action:hover{border-color:var(--gold)}.action:disabled{opacity:.55;cursor:wait}.empty,.error{padding:28px;text-align:center;color:var(--muted)}.error{color:#ec8d88}.note{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.55}
    @media(max-width:760px){.top,.toolbar{flex-direction:column}.search{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><a class="back" href="index.html">← Voltar para Central Nexus</a><h1>Controle do Nexus CRM</h1><p>Ações administrativas sincronizadas com o entitlement do CRM antes de confirmar na Central.</p></div>
      <div id="profile" style="color:var(--muted);font-size:12px;text-align:right"></div>
    </header>
    <section class="panel">
      <div class="toolbar"><div><strong>Clientes CRM</strong><div class="note">Suspender/Liberar só conclui quando o CRM confirma o evento assinado pelo backend.</div></div><input class="search" id="search" type="search" placeholder="Buscar empresa ou plano"></div>
      <div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Plano</th><th>Contrato</th><th>Acesso</th><th>Tenant CRM</th><th>Ação</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Carregando...</td></tr></tbody></table></div>
      <div id="message" class="error" hidden></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
  <script src="../sst-controle/supabase-config.js"></script>
  <script src="../sst-controle/supabase-auth.js"></script>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const subscriptionLabel=v=>({legacy:'Acesso inicial',trial:'Teste',active:'Ativa',past_due:'Em atraso',cancelled:'Cancelada'}[v]||v||'—');
    let rows=[];
    function effectiveStatus(row){if(row.subscription_status==='cancelled')return 'cancelled';if(row.access_status==='suspended'||row.subscription_status==='past_due')return 'suspended';return 'active';}
    function render(){const q=document.getElementById('search').value.trim().toLowerCase(),visible=rows.filter(r=>[r.organization?.name,r.plan?.name,r.subscription_status].join(' ').toLowerCase().includes(q));document.getElementById('rows').innerHTML=visible.length?visible.map(r=>{const status=effectiveStatus(r),linked=Boolean(r.external_tenant_id);return `<tr><td><strong>${esc(r.organization?.name||'—')}</strong></td><td>${esc(r.plan?.name||r.plan_name||'—')}</td><td><span class="badge ${r.subscription_status==='active'?'good':r.subscription_status==='past_due'?'warn':'bad'}">${esc(subscriptionLabel(r.subscription_status))}</span></td><td><span class="badge ${status==='active'?'good':status==='suspended'?'warn':'bad'}">${status==='active'?'Liberado':status==='suspended'?'Suspenso':'Cancelado'}</span></td><td>${linked?'Vinculado':'<span class="badge bad">Sem vínculo</span>'}</td><td><button class="action" data-toggle="${esc(r.id)}" data-status="${esc(r.access_status)}" ${!linked||r.subscription_status==='cancelled'?'disabled':''}>${r.access_status==='active'?'Suspender':'Liberar'}</button></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nenhum cliente CRM encontrado.</td></tr>';document.querySelectorAll('[data-toggle]').forEach(button=>button.onclick=()=>toggle(button));}
    async function load(){const client=window.NexusAuth.getClient();const{data,error}=await client.from('organization_product_access').select('id,access_status,subscription_status,plan_name,external_tenant_id,organization:organizations(name),product:nexus_products(code),plan:nexus_plans(name)').eq('product.code','crm').order('created_at');if(error)throw error;rows=(data||[]).filter(r=>r.product?.code==='crm');render();}
    async function toggle(button){const next=button.dataset.status==='active'?'suspended':'active';button.disabled=true;try{const client=window.NexusAuth.getClient();const{data,error}=await client.functions.invoke('nexus-admin-crm-access',{body:{accessId:button.dataset.toggle,accessStatus:next}});if(error)throw new Error(error.message||'Falha ao chamar o controle do CRM.');if(data?.error)throw new Error(data.error);if(data?.ok!==true)throw new Error('O CRM não confirmou a alteração.');await load();}catch(error){alert(error.message||'Não foi possível atualizar o acesso.');}finally{button.disabled=false;}}
    document.getElementById('search').addEventListener('input',render);
    (async()=>{try{const session=await window.NexusAuth.restoreSession();if(!session){location.replace('login.html');return;}if(session.role!=='nexus_admin')throw new Error('Acesso restrito à administração Nexus.');document.getElementById('profile').textContent=session.name||session.email;await load();}catch(error){document.getElementById('message').hidden=false;document.getElementById('message').textContent=error.message||'Não foi possível carregar os acessos do CRM.';}})();
  </script>
</body>
</html>
