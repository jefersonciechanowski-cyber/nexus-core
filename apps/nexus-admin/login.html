<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071015"><title>Acesso | Central Nexus</title><style>:root{--bg:#071015;--surface:#0d181e;--line:#293941;--gold:#d9a62d;--text:#f2eee4;--muted:#929da5;--danger:#ef8f8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 78% 5%,rgba(32,78,92,.2),transparent 30%),linear-gradient(145deg,#050b0f,#0a151b)}.wrap{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(8,16,20,.92)}.brand,.login{padding:44px}.brand{background:radial-gradient(circle at 40% 18%,rgba(217,166,45,.12),transparent 34%),linear-gradient(180deg,#0c171c,#081116)}.logo{width:min(340px,100%)}h1{font-size:32px;margin:24px 0 8px}.gold{color:var(--gold)}.muted{color:var(--muted);line-height:1.6}.field{margin-top:16px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input{width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--line);background:#091318;color:var(--text);outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,166,45,.1)}button{width:100%;margin-top:20px;padding:12px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(180deg,#e1b23f,#c98f22);color:#181207;font-weight:800;cursor:pointer}.error{min-height:20px;color:var(--danger);font-size:12px;margin-top:12px}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12px}.links a{color:var(--gold);text-decoration:none}@media(max-width:760px){.wrap{grid-template-columns:1fr}.brand,.login{padding:30px}}</style></head><body><main class="wrap"><section class="brand"><img class="logo" src="../sst-controle/logo-nexus-core.png" alt="Nexus Core"><h1>Central <span class="gold">Nexus</span></h1><p class="muted">Administração interna das empresas, apps e acessos da operação Nexus Core.</p></section><section class="login"><h2>Acesso administrativo</h2><p class="muted">Entre com sua conta Nexus.</p><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password"></div><button id="login" type="button">Entrar</button><div id="error" class="error"></div><div class="links"><a href="../portal-cliente/recuperar-senha.html">Esqueci minha senha</a><a href="../site-captacao/">Site comercial</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script><script src="../sst-controle/supabase-config.js"></script><script src="../sst-controle/supabase-auth.js"></script><script>const e=document.getElementById('email'),p=document.getElementById('password'),b=document.getElementById('login'),m=document.getElementById('error');async function login(){m.textContent='';b.disabled=true;b.textContent='Entrando...';try{const s=await window.NexusAuth.login(e.value,p.value);if(s.role!=='nexus_admin'){await window.NexusAuth.logout();throw new Error('Esta conta não possui acesso administrativo Nexus.');}location.href='index.html';}catch(err){m.textContent=err.message||'Não foi possível entrar.';}finally{b.disabled=false;b.textContent='Entrar';}}b.onclick=login;document.addEventListener('keydown',ev=>{if(ev.key==='Enter')login();});window.addEventListener('DOMContentLoaded',async()=>{try{const s=await window.NexusAuth.restoreSession();if(s?.role==='nexus_admin')location.href='index.html';}catch{}});</script></body></html>
