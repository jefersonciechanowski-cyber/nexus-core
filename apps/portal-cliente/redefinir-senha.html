<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071015"><title>Definir senha | Nexus Core</title><style>:root{--line:#293941;--gold:#d9a62d;--text:#f2eee4;--muted:#929da5;--danger:#ef8f8b;--success:#68c78d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 78% 5%,rgba(32,78,92,.2),transparent 30%),linear-gradient(145deg,#050b0f,#0a151b)}.wrap{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(8,16,20,.92)}.brand,.form{padding:44px}.brand{background:radial-gradient(circle at 40% 18%,rgba(217,166,45,.12),transparent 34%),linear-gradient(180deg,#0c171c,#081116)}.logo{width:min(340px,100%)}h1{font-size:31px;margin:24px 0 8px}.gold{color:var(--gold)}.muted{color:var(--muted);line-height:1.6}.field{margin-top:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}input{width:100%;padding:12px 13px;border-radius:8px;border:1px solid var(--line);background:#091318;color:var(--text);outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,166,45,.1)}button{width:100%;margin-top:20px;padding:12px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(180deg,#e1b23f,#c98f22);color:#181207;font-weight:800;cursor:pointer}.message{min-height:40px;margin-top:14px;font-size:12px;line-height:1.5}.error{color:var(--danger)}.success{color:var(--success)}a{color:var(--gold);text-decoration:none}.back{margin-top:18px;font-size:13px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.brand,.form{padding:30px}}</style></head><body><main class="wrap"><section class="brand"><img class="logo" src="../sst-controle/logo-nexus-core.png" alt="Nexus Core"><h1>Defina sua senha da <span class="gold">Central Nexus</span></h1><p class="muted">Use esta página para o primeiro acesso ou para concluir uma recuperação de senha. Depois você entra normalmente com e-mail e senha.</p></section><section class="form"><h2>Nova senha</h2><p class="muted" id="sessionText">Validando o link de acesso...</p><div class="field"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div><div class="field"><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Digite novamente"></div><button id="save" type="button" disabled>Salvar nova senha</button><div id="message" class="message" aria-live="polite"></div><div class="back"><a href="login.html">Voltar para o login</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../sst-controle/supabase-config.js"></script><script>const cfg=window.NEXUS_SUPABASE_CONFIG;const client=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true}});const pass=document.getElementById('password'),confirm=document.getElementById('confirm'),save=document.getElementById('save'),message=document.getElementById('message'),sessionText=document.getElementById('sessionText');function show(text,type){message.textContent=text;message.className='message '+type}async function validate(){const{data}=await client.auth.getSession();if(data?.session){sessionText.textContent=`Conta autenticada: ${data.session.user.email||'usuário Nexus'}`;save.disabled=false;return}sessionText.textContent='O link é inválido ou expirou.';show('Solicite uma nova recuperação de senha para continuar.','error')}async function update(){const a=pass.value,b=confirm.value;show('','');if(a.length<8)return show('A senha precisa ter pelo menos 8 caracteres.','error');if(a!==b)return show('As senhas digitadas não são iguais.','error');save.disabled=true;save.textContent='Salvando...';const{error}=await client.auth.updateUser({password:a});if(error){show(error.message||'Não foi possível atualizar a senha.','error');save.disabled=false;save.textContent='Salvar nova senha';return}show('Senha definida com sucesso. Redirecionando para a Minha Central...','success');setTimeout(async()=>{await client.auth.signOut({scope:'local'});location.href='login.html'},1600)}save.onclick=update;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!save.disabled)update()});client.auth.onAuthStateChange((_event,session)=>{if(session){sessionText.textContent=`Conta autenticada: ${session.user.email||'usuário Nexus'}`;save.disabled=false}});validate();</script></body></html>
